[workspace]
resolver = "2"
members = [
    "crates/qv-proto",
    "crates/qv-hnsw",
    "crates/qv-storage",
    "crates/qv-cluster",
    "crates/qv-node",
    "crates/qv-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
authors = ["mickelsamuel <mickelsamuel.b@gmail.com>"]
repository = "https://github.com/mickelsamuel/quorvec"

# Dependency versions are pinned once here and inherited by member crates via
# `dep.workspace = true`. Versions verified current on crates.io 2026-06-12.
[workspace.dependencies]
# gRPC / protobuf (tonic 0.14 split: tonic = transport, tonic-prost = codec,
# tonic-prost-build = build-time codegen).
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14.4"
# Precompiled protoc so no system protoc is required on dev or CI hosts.
protoc-bin-vendored = "3.2.0"

# Async runtime.
tokio = { version = "1.47", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# Distance kernels for HNSW (scalar fallback behind a feature flag in qv-hnsw).
simsimd = "6.5.16"

# Hashing / placement.
xxhash-rust = { version = "0.8", features = ["xxh64"] }
crc32fast = "1.4"

# Metadata-plane consensus. Pinned to the latest STABLE openraft (0.9.x); the
# 0.10 line is alpha as of 2026-06. Pre-1.0 API per the plan; storage-v2 splits
# the log store from the state-machine store.
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config.
toml = "0.8"

# Errors.
thiserror = "2.0"
anyhow = "1.0"

# Test / bench.
proptest = "1.5"
criterion = "0.5"
rand = "0.8"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
