syntax = "proto3";

// quorvec v1 gRPC surface.
//
// LOCKED: this surface is the v1 contract. It does NOT change without architect
// sign-off. Defaults noted in comments (shard_count=8, replication_n=3, k=10,
// ef_search=64) are proto3-unrepresentable as wire defaults and are applied
// server-side when a field is left at its proto3 zero value.
package quorvec.v1;

// ----- Enums ----------------------------------------------------------------

// Distance metric for a collection's vectors.
enum Metric {
  METRIC_UNSPECIFIED = 0; // treated as an error at CreateCollection time
  METRIC_L2 = 1;          // squared/euclidean L2
  METRIC_COSINE = 2;      // cosine distance
}

// Tunable consistency level for data-plane writes and reads.
// ONE = 1 ack, QUORUM = floor(N/2)+1 acks, ALL = N acks.
enum Consistency {
  CONSISTENCY_UNSPECIFIED = 0; // applied as QUORUM server-side (safe default)
  CONSISTENCY_ONE = 1;
  CONSISTENCY_QUORUM = 2;
  CONSISTENCY_ALL = 3;
}

// Lifecycle state of a single shard replica, surfaced by ClusterInfo.
enum ShardState {
  SHARD_STATE_UNSPECIFIED = 0;
  SHARD_STATE_ACTIVE = 1;
  SHARD_STATE_SYNCING = 2;
  SHARD_STATE_DEAD = 3;
}

// ----- Core point type ------------------------------------------------------

message Point {
  uint64 id = 1;
  repeated float vector = 2;
  // Opaque payload bytes; quorvec v1 does not interpret or index payloads.
  optional bytes payload = 3;
}

// A scored search hit.
message ScoredPoint {
  uint64 id = 1;
  float score = 2;
  optional bytes payload = 3;
}

// ----- CreateCollection -----------------------------------------------------

message CreateCollectionRequest {
  string name = 1;
  uint32 dim = 2;
  Metric metric = 3;
  uint32 shard_count = 4;    // default 8 when zero
  uint32 replication_n = 5;  // default 3 when zero
}

message CreateCollectionResponse {}

// ----- DropCollection -------------------------------------------------------

message DropCollectionRequest {
  string name = 1;
}

message DropCollectionResponse {}

// ----- Upsert ---------------------------------------------------------------

message UpsertRequest {
  string collection = 1;
  repeated Point points = 2;
  Consistency consistency = 3;
}

message UpsertResponse {
  // Number of points accepted (acked at the requested W).
  uint64 upserted = 1;
}

// ----- Delete ---------------------------------------------------------------

message DeleteRequest {
  string collection = 1;
  repeated uint64 ids = 2;
  Consistency consistency = 3;
}

message DeleteResponse {
  uint64 deleted = 1;
}

// ----- Get ------------------------------------------------------------------

message GetRequest {
  string collection = 1;
  repeated uint64 ids = 2;
  Consistency read_consistency = 3;
}

message GetResponse {
  // HLC-merged points (newest wins). Missing/tombstoned ids are omitted.
  repeated Point points = 1;
}

// ----- Search ---------------------------------------------------------------

message SearchRequest {
  string collection = 1;
  repeated float vector = 2;
  uint32 k = 3;          // default 10 when zero
  uint32 ef_search = 4;  // default 64 when zero
}

message SearchResponse {
  repeated ScoredPoint results = 1;
}

// ----- ClusterInfo ----------------------------------------------------------

message NodeInfo {
  uint64 node_id = 1;
  string advertise_addr = 2;
}

// One replica assignment: which shard of which collection lives where, and its
// state on that node.
message ShardAssignment {
  string collection = 1;
  uint32 shard_idx = 2;
  uint64 node_id = 3;
  ShardState state = 4;
}

message ClusterInfoRequest {}

message ClusterInfoResponse {
  repeated NodeInfo nodes = 1;
  repeated ShardAssignment shard_map = 2;
  uint64 raft_leader = 3;
  string version = 4;
}

// ----- Join / Leave (admin; metadata-plane ops) -----------------------------

message JoinRequest {
  string advertise_addr = 1;
}

message JoinResponse {
  uint64 node_id = 1;
}

message LeaveRequest {
  uint64 node_id = 1;
}

message LeaveResponse {}

// ----- Health ---------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// ----- Service --------------------------------------------------------------

service Quorvec {
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ClusterInfo(ClusterInfoRequest) returns (ClusterInfoResponse);
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
